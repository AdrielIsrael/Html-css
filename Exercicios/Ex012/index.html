<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos Hospedados</title>
</head>
<body>
    <h1>Inserir videos hospedaos localmente</h1>
    <p>Este video esta hospedado em meu propio servidor</p>

    <video src="midia/meu-video.mp3" width="500" controls></video>
    <video controls>
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.ogv" type="video/ogg">
        <source src="midia/meu-video.m4v" type="video/mp4">
        <source src="midia/meu-video.webm" type="video/webm">
    </video>
    <p>Se seu navegador nao tiver compatibilidade com o formato do video baixe no seu computador <a href="#">clique aqui !</a></p>
</body>
</html>
